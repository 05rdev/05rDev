<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="actBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#080b16" />
    </linearGradient>

    <!-- Aurora Holographic Accent -->
    <linearGradient id="actAurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#4facfe" />
      <stop offset="75%" stop-color="#9b51e0" />
      <stop offset="100%" stop-color="#ff416c" />
    </linearGradient>

    <!-- Panel Background Gradient -->
    <linearGradient id="actPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0.9" />
    </linearGradient>

    <!-- Background Grid -->
    <pattern id="actGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#4facfe" opacity="0.1" />
    </pattern>

    <style><![CDATA[
      /* Perimeter light circuit stream */
      .act-stream {
        stroke-dasharray: 14, 200;
        animation: streamFlow 10s linear infinite;
      }
      @keyframes streamFlow {
        to { stroke-dashoffset: -856; }
      }

      /* Radar pulse */
      .radar-pulse {
        animation: radarPing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        transform-origin: 38px 28px;
      }
      @keyframes radarPing {
        0% { r: 3px; opacity: 1; stroke-width: 1px; }
        70% { r: 13px; opacity: 0; stroke-width: 2px; }
        100% { r: 15px; opacity: 0; stroke-width: 0; }
      }

      /* Equalizer animated bars */
      .eq-bar-1 { animation: eqJump 1.2s ease-in-out infinite alternate; transform-origin: bottom; }
      .eq-bar-2 { animation: eqJump 1.5s ease-in-out infinite alternate 0.2s; transform-origin: bottom; }
      .eq-bar-3 { animation: eqJump 1.1s ease-in-out infinite alternate 0.4s; transform-origin: bottom; }
      .eq-bar-4 { animation: eqJump 1.6s ease-in-out infinite alternate 0.1s; transform-origin: bottom; }
      .eq-bar-5 { animation: eqJump 1.3s ease-in-out infinite alternate 0.3s; transform-origin: bottom; }
      .eq-bar-6 { animation: eqJump 1.4s ease-in-out infinite alternate 0.5s; transform-origin: bottom; }
      @keyframes eqJump {
        0% { height: 6px; y: 32px; }
        50% { height: 26px; y: 12px; }
        100% { height: 14px; y: 24px; }
      }

      /* Streak flame pulse and ring glow */
      .streak-fire {
        animation: firePulse 1.8s ease-in-out infinite alternate;
        transform-origin: center;
      }
      @keyframes firePulse {
        0% { transform: scale(1); filter: drop-shadow(0 0 4px #ff416c); }
        100% { transform: scale(1.15) translateY(-2px); filter: drop-shadow(0 0 10px #ff7b54); }
      }

      .streak-ring {
        animation: ringBreathe 3s ease-in-out infinite;
      }
      @keyframes ringBreathe {
        0%, 100% { stroke: #00f2fe; stroke-width: 2.2; filter: drop-shadow(0 0 4px rgba(0, 242, 254, 0.4)); }
        50% { stroke: #4facfe; stroke-width: 2.8; filter: drop-shadow(0 0 10px rgba(79, 172, 254, 0.7)); }
      }

      /* Glowing Text */
      .glow-cyan { fill: #00f2fe; filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.5)); }
      .glow-purple { fill: #9b51e0; filter: drop-shadow(0 0 6px rgba(155, 81, 224, 0.5)); }

      .font-mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ]]></style>
  </defs>

  <!-- Base Canvas -->
  <rect width="840" height="260" rx="14" fill="url(#actBg)" />
  <rect width="840" height="260" rx="14" fill="url(#actGrid)" />

  <!-- Outer Border Frame -->
  <path d="M 24,10 L 816,10 Q 830,10 830,24 L 830,236 Q 830,250 816,250 L 24,250 Q 10,250 10,236 L 10,24 Q 10,10 24,10 Z"
        fill="none" stroke="#1d283f" stroke-width="1.2" />

  <!-- Animated Circuit Stream -->
  <path class="act-stream" d="M 24,10 L 816,10 Q 830,10 830,24 L 830,236 Q 830,250 816,250 L 24,250 Q 10,250 10,236 L 10,24 Q 10,10 24,10 Z"
        fill="none" stroke="url(#actAurora)" stroke-width="2" stroke-linecap="round" />

  <!-- Top Header Telemetry -->
  <g transform="translate(0, 0)">
    <!-- Radar ping -->
    <circle class="radar-pulse" cx="38" cy="28" r="3.5" fill="none" stroke="#00f2fe" />
    <circle cx="38" cy="28" r="3" fill="#00f2fe" />
    
    <text x="52" y="32" class="font-mono" font-size="10" font-weight="700" fill="#00f2fe" letter-spacing="1.5">
      SYSTEM_TELEMETRY // ENGINEERING_ACTIVITY
    </text>

    <text x="805" y="32" class="font-mono" font-size="9" fill="#7186a6" letter-spacing="1.2" text-anchor="end">
      ENGINE: VIBE_MODE_10X // STACK_PROFILE: FULL_SPECTRUM
    </text>

    <!-- Dividing accent line -->
    <line x1="28" y1="46" x2="812" y2="46" stroke="#1d283f" stroke-width="1" />
  </g>

  <!-- Left Panel: Commit Cadence and Streak Analytics -->
  <g transform="translate(30, 60)">
    <rect width="386" height="152" rx="8" fill="url(#actPanel)" stroke="#1e2c45" stroke-width="1" />
    <line x1="0" y1="0" x2="40" y2="0" stroke="#00f2fe" stroke-width="2.5" />

    <!-- Subheader -->
    <text x="16" y="24" class="font-mono" font-size="10" font-weight="700" fill="#00f2fe" letter-spacing="1.5">
      COMMIT_ACTIVITY &amp; STREAK
    </text>
    <text x="370" y="24" class="font-mono" font-size="8.5" fill="#7186a6" letter-spacing="1" text-anchor="end">
      LIVE_CADENCE
    </text>

    <!-- 3 Symmetrical Metric Columns separated by vertical dividers -->
    <line x1="128" y1="36" x2="128" y2="122" stroke="#1d283f" stroke-width="1" />
    <line x1="258" y1="36" x2="258" y2="122" stroke="#1d283f" stroke-width="1" />

    <!-- Column 1: TOTAL CONTRIBUTIONS -->
    <g transform="translate(0, 36)">
      <text id="stat-total" x="64" y="32" class="font-mono" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">
        255+
      </text>
      <text x="64" y="52" class="font-mono" font-size="8" font-weight="700" fill="#4facfe" text-anchor="middle" letter-spacing="0.5">
        TOTAL
      </text>
      <text x="64" y="64" class="font-mono" font-size="8" font-weight="700" fill="#4facfe" text-anchor="middle" letter-spacing="0.5">
        CONTRIBUTIONS
      </text>
      <text x="64" y="80" class="font-mono" font-size="7" fill="#6982a5" text-anchor="middle">
        Oct 2024 - Present
      </text>
    </g>

    <!-- Column 2: CURRENT STREAK (Hero with animated glowing ring and flame) -->
    <g transform="translate(193, 36)">
      <!-- Pulsing Circle Ring -->
      <circle class="streak-ring" cx="0" cy="24" r="20" fill="#070d18" stroke="#00f2fe" stroke-width="2.5" />
      
      <!-- Flame Icon -->
      <text class="streak-fire" x="0" y="14" font-size="12" text-anchor="middle">🔥</text>

      <!-- Streak Number -->
      <text id="stat-current" x="0" y="31" class="font-mono" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">
        14
      </text>

      <!-- Label -->
      <text x="0" y="60" class="font-mono" font-size="8" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="0.5">
        CURRENT STREAK
      </text>
      <text x="0" y="74" class="font-mono" font-size="7" fill="#6982a5" text-anchor="middle">
        Active Daily
      </text>
    </g>

    <!-- Column 3: LONGEST STREAK -->
    <g transform="translate(258, 36)">
      <text id="stat-longest" x="64" y="32" class="font-mono" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">
        14
      </text>
      <text x="64" y="52" class="font-mono" font-size="8" font-weight="700" fill="#4facfe" text-anchor="middle" letter-spacing="0.5">
        LONGEST
      </text>
      <text x="64" y="64" class="font-mono" font-size="8" font-weight="700" fill="#4facfe" text-anchor="middle" letter-spacing="0.5">
        STREAK
      </text>
      <text x="64" y="80" class="font-mono" font-size="7" fill="#6982a5" text-anchor="middle">
        Target: 100+ Days
      </text>
    </g>

    <!-- Sub Footer inside Left Panel -->
    <line x1="16" y1="128" x2="370" y2="128" stroke="#1d283f" stroke-width="0.8" />
    <circle cx="20" cy="140" r="2" fill="#00f2fe" />
    <text x="28" y="142" class="font-mono" font-size="7.5" fill="#586f91" letter-spacing="1">
      STATUS: ACTIVE // DAILY COMMITS // CONSISTENT GROWTH
    </text>
  </g>

  <!-- Vertical Divider -->
  <line x1="422" y1="62" x2="422" y2="215" stroke="#1d283f" stroke-width="1" stroke-dasharray="3, 3" />

  <!-- Right Panel: AI Vibecoding Engine and Production Mindset -->
  <g transform="translate(446, 60)">
    <rect width="366" height="152" rx="8" fill="url(#actPanel)" stroke="#1e2c45" stroke-width="1" />
    <line x1="0" y1="0" x2="40" y2="0" stroke="#00f2fe" stroke-width="2.5" />

    <!-- Panel Title and Dynamic Equalizer Waves -->
    <text x="16" y="24" class="font-mono" font-size="10" font-weight="700" fill="#00f2fe" letter-spacing="1.5">
      AI_VIBECODING_VELOCITY
    </text>

    <!-- Mini Equalizer bars indicating live development frequency -->
    <g transform="translate(290, 8)">
      <rect class="eq-bar-1" x="0" y="14" width="4" height="18" rx="2" fill="#00f2fe" />
      <rect class="eq-bar-2" x="7" y="10" width="4" height="22" rx="2" fill="#4facfe" />
      <rect class="eq-bar-3" x="14" y="16" width="4" height="16" rx="2" fill="#9b51e0" />
      <rect class="eq-bar-4" x="21" y="8" width="4" height="24" rx="2" fill="#00f2fe" />
      <rect class="eq-bar-5" x="28" y="18" width="4" height="14" rx="2" fill="#4facfe" />
      <rect class="eq-bar-6" x="35" y="12" width="4" height="20" rx="2" fill="#ff416c" />
    </g>

    <!-- Subtitle -->
    <text x="16" y="44" class="font-sans" font-size="11" font-weight="600" fill="#ffffff">
      Building High-Velocity Solutions with AI Collaboration
    </text>

    <!-- 3 Telemetry Spec Lines -->
    <g transform="translate(16, 60)">
      <circle cx="3" cy="7" r="2" fill="#4facfe" />
      <text x="12" y="10" class="font-mono" font-size="8.5" fill="#a4b7d3">
        WORKFLOW: <tspan fill="#00f2fe">AI-Augmented Architecture &amp; Rapid Iterations</tspan>
      </text>

      <circle cx="3" cy="25" r="2" fill="#9b51e0" />
      <text x="12" y="28" class="font-mono" font-size="8.5" fill="#a4b7d3">
        AI FOCUS: <tspan fill="#c3d4ee">pgvector Semantic Search • LLMs • RAG Patterns</tspan>
      </text>

      <circle cx="3" cy="43" r="2" fill="#ff416c" />
      <text x="12" y="46" class="font-mono" font-size="8.5" fill="#a4b7d3">
        SHIPMENT: <tspan fill="#c3d4ee">Production-Ready APIs • Dockerized Deployments</tspan>
      </text>

      <circle cx="3" cy="61" r="2" fill="#00f2fe" />
      <text x="12" y="64" class="font-mono" font-size="8.5" fill="#a4b7d3">
        STATUS: <tspan fill="#00f2fe" font-weight="bold">READY FOR FULL-TIME ROLES &amp; IMPACT</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Technical Telemetry Bar -->
  <g transform="translate(30, 236)">
    <circle cx="4" cy="4" r="2" fill="#00f2fe" />
    <text x="14" y="7" class="font-mono" font-size="8" fill="#586f91" letter-spacing="1">
      TELEMETRY // CODE_CADENCE: ACTIVE // PIPELINE: GIT ➔ AI_ASSIST ➔ BUILD ➔ DEPLOY // CONTINUOUS_IMPROVEMENT
    </text>
    <text x="780" y="7" class="font-mono" font-size="8" fill="#586f91" letter-spacing="1" text-anchor="end">
      05rDev::ENGINEERING
    </text>
  </g>
</svg>
